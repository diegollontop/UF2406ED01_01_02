{% extends "base.html" %}

{% block content %}
    <h1>Nueva contraseña</h1>

    <!-- Condicional que verifica si el token de recuperación sigue siendo válido y seguro -->
    {% if validlink %}
        <p>Introduce tu nueva contraseña dos veces.</p>
        
        <form method="post">
            <!-- Token de seguridad obligatorio de Django para evitar ataques maliciosos CSRF -->
            {% csrf_token %}
            
            <!-- Renderiza los campos del formulario de la nueva contraseña estructurados en párrafos -->
            {{ form.as_p }}
            
            <button type="submit">Cambiar contraseña</button>
        </form>
    {% else %}
        <!-- Mensaje de error que se muestra si el enlace ha caducado o el token ya se utilizó -->
        <p>El enlace de recuperación no es válido o ha caducado.</p>
        <a href="{% url 'password_reset' %}">Solicitar otro enlace</a>
    {% endif %}
{% endblock %}
