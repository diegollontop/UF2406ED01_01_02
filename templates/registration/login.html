{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

    <h1>
        Iniciar sesión
    </h1>

    <!-- Muestra un mensaje de advertencia si las credenciales de acceso fallan -->
    {% if form.errors %}
        <p>
            Usuario o contraseña incorrectos.
        </p>
    {% endif %}

    <form method="post">
        <!-- Token de seguridad obligatorio de Django para evitar ataques maliciosos CSRF -->
        {% csrf_token %}
        
        <!-- Renderiza los campos del formulario de inicio de sesión estructurados en párrafos -->
        {{ form.as_p }}
        
        <button type="submit">
            Entrar
        </button>
    </form>

    <p>
        <a href="{% url 'password_reset' %}">¿Has olvidado tu contraseña?</a>
    </p>
    <p>
        ¿No tienes cuenta? 
        <a href="{% url 'register' %}">
            Registrarse
        </a>
    </p>
    
{% endblock %}
